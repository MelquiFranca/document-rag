services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evidence_auditor
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence_auditor"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - evidence-auditor-postgres:/var/lib/postgresql/data
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro

volumes:
  evidence-auditor-postgres:
